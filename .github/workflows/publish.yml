name: Publish to NuGet.org

on:
  push:
    tags:
      - 'v*'  # 当你推送 v1.0.0, v1.0.1 等标签时自动触发

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install NuGet
        uses: nuget/setup-nuget@v1
        with:
          nuget-version: 'latest'

      - name: Restore packages
        run: nuget restore CustomMessageBox.sln

      # ===== 添加这一行 =====
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          msbuild CustomMessageBox.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Get version
        id: version
        run: |
          $VERSION = "${{ github.ref_name }}".Substring(1)
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 关键修改：加上子文件夹路径
      - name: Pack with nuget.exe
        run: |
          nuget pack CustomMessageBox/CustomMessageBox.csproj -Properties Configuration=Release -Version ${{ steps.version.outputs.VERSION }} -OutputDirectory artifacts

      # 调试：列出 artifacts 目录内容
      - name: List files after pack
        run: |
          echo "Current directory:"
          dir
          echo "Artifacts directory:"
          if (Test-Path artifacts) { dir artifacts } else { Write-Host "artifacts folder not found" }

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          # 使用 Get-ChildItem 找到 .nupkg 文件并推送
          $pkg = Get-ChildItem artifacts\*.nupkg | Select-Object -First 1
          if ($pkg) {
            dotnet nuget push $pkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
          } else {
            Write-Error "No .nupkg file found in artifacts folder"
            exit 1
          }